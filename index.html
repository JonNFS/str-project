  --text:        #f1f5f9;
  --muted:       #475569;
  --muted2:      #94a3b8;
  --success:     #22c55e;
  --danger:      #ef4444;
  --discord:     #5865F2;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 80% 60% at 20% -10%,rgba(99,102,241,0.12) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(99,102,241,0.08) 0%,transparent 60%);
  pointer-events:none}
body::after{content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size:50px 50px;pointer-events:none}

/* ── VIEWS ── */
.view{display:none;position:relative;z-index:1}
.view.active{display:flex}

/* ── LOADING ── */
#v-loading{min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#v-loading p{color:var(--muted2);font-size:.9rem}

/* ── AUTH SCREENS ── */
#v-login,#v-no-member{min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:52px 48px;max-width:420px;width:100%;text-align:center;animation:fadeUp .5s ease;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.auth-logo{font-size:2.2rem;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
.auth-logo span{color:var(--accent-l)}
.auth-sub{font-size:.75rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.auth-tagline{color:var(--muted2);font-size:.9rem;margin-bottom:32px;line-height:1.5}
.auth-divider{height:1px;background:var(--border);margin:24px 0}
.btn-discord{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--discord);color:#fff;border:none;border-radius:12px;padding:14px 20px;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-discord:hover{background:#4752c4;transform:translateY(-2px);box-shadow:0 8px 24px rgba(88,101,242,.4)}
.btn-discord svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:transparent;color:var(--muted2);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;text-decoration:none;margin-top:12px}
.btn-secondary:hover{border-color:var(--muted2);color:var(--text)}
.auth-note{margin-top:24px;font-size:.78rem;color:var(--muted);line-height:1.5}
.auth-note strong{color:var(--muted2)}

/* ── APP SHELL ── */
#v-app{flex-direction:column;min-height:100vh}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;background:rgba(7,8,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.hdr-left{display:flex;align-items:center;gap:16px}
.header-logo{font-size:1.3rem;font-weight:900;letter-spacing:-0.5px;white-space:nowrap}
.header-logo span{color:var(--accent-l)}
.header-logo small{font-size:.6rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-left:4px;vertical-align:middle}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:220px}
.search-bar input{background:transparent;border:none;color:var(--text);font-family:'Outfit',sans-serif;font-size:.88rem;outline:none;width:100%}
.search-bar input::placeholder{color:var(--muted)}
.search-bar svg{color:var(--muted);flex-shrink:0;width:15px;height:15px}
.hdr-right{display:flex;align-items:center;gap:10px}
.cart-btn{position:relative;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:8px 16px;color:var(--text);font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.cart-btn:hover{border-color:var(--accent);color:var(--accent-l)}
.cart-count{position:absolute;top:-7px;right:-7px;background:var(--accent);color:#fff;font-size:.62rem;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.cart-price{color:var(--accent-l);font-weight:800}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 12px}
.user-chip img{width:26px;height:26px;border-radius:50%}
.user-chip span{font-size:.83rem;font-weight:600;color:var(--muted2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:4px;transition:color .15s;line-height:1}
.logout-btn:hover{color:var(--danger)}

/* ── MAIN LAYOUT: sidebar + content ── */
.app-body{display:flex;flex:1;min-height:0}

/* ── SIDEBAR ── */
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sidebar-section{padding:12px 16px 4px;font-size:.68rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.nav-cat{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:0;color:var(--muted2);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:transparent;width:100%;text-align:left}
.nav-cat:hover{background:var(--surface2);color:var(--text)}
.nav-cat.active{background:rgba(99,102,241,.12);color:var(--accent-l);font-weight:700;border-left:2px solid var(--accent)}
.nav-cat .cat-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.sidebar-divider{height:1px;background:var(--border);margin:8px 12px}
.cart-mini{margin:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px}
.cart-mini-title{font-size:.75rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.cart-mini-items{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto}
.cart-mini-item{font-size:.8rem;color:var(--muted2);display:flex;justify-content:space-between;align-items:center;gap:6px}
.cart-mini-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cart-mini-item .price{color:var(--accent-l);font-weight:700;flex-shrink:0}
.cart-mini-empty{font-size:.8rem;color:var(--muted);text-align:center;padding:8px 0}
.cart-mini-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.85rem;font-weight:700}
.cart-mini-total .val{color:var(--accent-l);font-size:.95rem}
.btn-checkout-mini{width:100%;margin-top:10px;background:var(--accent);border:none;border-radius:9px;padding:10px;color:#fff;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-checkout-mini:hover{background:var(--accent-l)}
.btn-checkout-mini:disabled{opacity:.4;cursor:not-allowed}

/* ── CONTENT AREA ── */
.content{flex:1;overflow-y:auto;padding:0}

/* ── HERO BANNER ── */
.hero{position:relative;overflow:hidden;border-radius:0;margin:0;background:var(--surface2)}
.hero-slides{display:flex;transition:transform .5s ease}
.hero-slide{flex-shrink:0;width:100%;min-height:240px;position:relative;display:flex;align-items:flex-end;padding:28px 36px;background:linear-gradient(135deg,#0d0f1a,#1a1035)}
.hero-slide-bg{position:absolute;inset:0;object-fit:cover;opacity:.35;width:100%;height:100%}
.hero-slide-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,15,.95) 0%,rgba(7,8,15,.3) 100%)}
.hero-badge{display:inline-block;background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.hero-title{font-size:2rem;font-weight:900;line-height:1.1;letter-spacing:-0.5px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.hero-sub{color:var(--muted2);font-size:.9rem;margin-top:6px;margin-bottom:18px}
.hero-promo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.hero-promo .discount{background:rgba(245,158,11,.2);color:var(--gold);font-size:.8rem;font-weight:800;padding:4px 12px;border-radius:20px}
.hero-promo .label{color:var(--muted2);font-size:.85rem}
.btn-hero{background:var(--accent);border:none;border-radius:10px;padding:12px 28px;color:#fff;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-hero:hover{background:var(--accent-l);transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-g)}
.hero-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(0,0,0,.4);border:1px solid var(--border2);width:32px;height:32px;border-radius:8px;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.hero-nav:hover{background:var(--accent)}
.hero-prev{left:12px}
.hero-next{right:12px}
.hero-dots{position:absolute;bottom:16px;right:20px;display:flex;gap:6px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .2s;cursor:pointer}
.hero-dot.active{background:var(--accent);width:18px;border-radius:3px}
.hero-content{position:relative;z-index:2}

/* ── SECTIONS ── */
.store-content{padding:24px}
.cat-section{margin-bottom:36px;animation:fadeUp .4s ease}
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cat-header-left{display:flex;align-items:center;gap:10px}
.cat-icon-big{font-size:1.2rem}
.cat-name{font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
.cat-count{font-size:.72rem;font-weight:600;color:var(--muted);background:var(--surface2);padding:3px 8px;border-radius:6px}
.ver-todos{font-size:.78rem;font-weight:600;color:var(--muted2);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;transition:color .15s;font-family:'Outfit',sans-serif}
.ver-todos:hover{color:var(--accent-l)}

/* ── PRODUCT GRID ── */
.products-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

/* ── PRODUCT CARD ── */
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s;display:flex;flex-direction:column;position:relative}
.product-card:hover{border-color:rgba(99,102,241,.4);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.product-card.featured{border-color:rgba(245,158,11,.3)}
.product-card.featured:hover{border-color:rgba(245,158,11,.6);box-shadow:0 16px 40px rgba(0,0,0,.4),0 0 20px var(--gold-g)}
.card-img-wrap{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface2),var(--surface3));height:150px;display:flex;align-items:center;justify-content:center}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.product-card:hover .card-img-wrap img{transform:scale(1.04)}
.card-img-placeholder{font-size:3rem;opacity:.4}
.card-badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:.62rem;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase;backdrop-filter:blur(6px)}
.badge-featured{background:rgba(245,158,11,.25);color:var(--gold);border:1px solid rgba(245,158,11,.3)}
.badge-new{background:rgba(34,197,94,.2);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.badge-sale{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.card-body{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.card-name{font-size:.9rem;font-weight:800;line-height:1.2;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.card-meta{display:flex;flex-direction:column;gap:2px;flex:1}
.card-qty{font-size:.75rem;color:var(--muted2);font-weight:500}
.card-expiry{font-size:.7rem;color:#f87171;font-weight:600}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);margin-top:auto}
.card-price{font-size:1.1rem;font-weight:900;color:var(--text)}
.card-price-old{font-size:.72rem;color:var(--muted);text-decoration:line-through;margin-bottom:1px}
.card-price-wrap{display:flex;flex-direction:column}
.btn-add{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:var(--accent-l);border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;flex-shrink:0}
.btn-add:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.08)}
.btn-add.added{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80}

/* ── HOVER OVERLAY ── */
.card-hover-overlay{position:absolute;inset:0;background:rgba(7,8,15,.93);padding:16px;opacity:0;pointer-events:none;transition:opacity .2s ease;display:flex;flex-direction:column;z-index:8}
.product-card:hover .card-hover-overlay{opacity:1;pointer-events:auto}
.ov-title{font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent-l);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid rgba(99,102,241,.2)}
.ov-items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.ov-item{font-size:.78rem;color:var(--text);line-height:1.4;opacity:.9}
.ov-desc{font-size:.76rem;color:var(--muted2);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.6;white-space:pre-line}

/* ── CART DRAWER ── */
.drawer-overlay{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.drawer-overlay.open{display:block}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;z-index:90;width:400px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.cart-drawer.open{transform:translateX(0)}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border)}
.drawer-hdr h2{font-size:1.1rem;font-weight:800}
.drawer-close{background:var(--surface2);border:none;width:30px;height:30px;border-radius:8px;color:var(--muted2);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.drawer-close:hover{background:var(--surface3);color:var(--text)}
.cart-items-list{flex:1;overflow-y:auto;padding:14px}
.cart-item{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;animation:fadeUp .2s ease}
.cart-item-img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--surface3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:.85rem;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-item-price{font-size:.8rem;color:var(--accent-l);font-weight:700}
.cart-item-qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty-btn{width:22px;height:22px;background:var(--surface3);border:none;border-radius:5px;color:var(--text);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:hover{background:var(--accent)}
.qty-val{font-size:.8rem;font-weight:700;min-width:18px;text-align:center}
.cart-remove{background:none;border:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:4px;transition:color .15s;align-self:center;flex-shrink:0}
.cart-remove:hover{color:var(--danger)}
.cart-empty-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;color:var(--muted);gap:10px;font-size:.9rem}
.cart-footer{padding:18px;border-top:1px solid var(--border)}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cart-total-label{font-size:.85rem;color:var(--muted2)}
.cart-total-value{font-size:1.3rem;font-weight:900}
.btn-checkout{width:100%;background:var(--accent);border:none;border-radius:10px;padding:13px;color:#fff;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-checkout:hover{background:var(--accent-l);box-shadow:0 8px 24px var(--accent-g)}
.btn-checkout:disabled{opacity:.4;cursor:not-allowed}

/* ── TOAST ── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;font-size:.85rem;max-width:300px;animation:slideR .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
.toast.success{border-color:rgba(34,197,94,.3)}
.toast.error{border-color:rgba(239,68,68,.3)}
@keyframes slideR{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* ── MODAL ── */
.modal-back{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.modal-back.open{display:flex}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:32px;width:100%;max-width:400px;animation:modalIn .25s ease;box-shadow:0 40px 80px rgba(0,0,0,.6)}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:13px 16px;color:var(--text);font-family:'Outfit',sans-serif;font-size:.95rem;outline:none;margin-bottom:16px;transition:border-color .2s}
.modal-input:focus{border-color:var(--accent)}
.btn-modal{width:100%;background:var(--accent);border:none;border-radius:10px;padding:13px;color:#fff;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-modal:hover{background:var(--accent-l)}

/* ── UTILS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hidden{display:none!important}
.empty-section{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem}

@media(max-width:720px){
  .sidebar{display:none}
  .search-bar{min-width:140px}
  .hero-title{font-size:1.4rem}
  .store-content{padding:16px}
  .products-row{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
}

  </style>
</head>
<body>

<!-- LOADING -->
<div id="v-loading" class="view active">
  <div class="spinner"></div>
  <p>Carregando...</p>
</div>

<!-- LOGIN -->
<div id="v-login" class="view">
  <div class="auth-card">
    <div class="auth-logo">THE DUEL<span>.</span></div>
    <div class="auth-sub">Store</div>

<script>

/* ═══════════════════════════════════════
   CONFIG
═══════════════════════════════════════ */
const CFG = {
  supabaseUrl:    'https://nhabzmzryhpghemqzblr.supabase.co',
  supabaseKey:    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oYWJ6bXpyeWhwZ2hlbXF6YmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NjYzNjEsImV4cCI6MjA5NTA0MjM2MX0.9eOx7nsTK3ryeqG7RJorg9EdkKHa6XkMbA7yN-eBm-E',
  discordServerId:'1507470596420927628',
  discordInvite:  'https://discord.gg/BvFuJbDQ6w',
  siteUrl:        'https://str-project-pink.vercel.app/',
};

/* ═══════════════════════════════════════
   SUPABASE INIT
═══════════════════════════════════════ */
const { createClient } = supabase;
const sb = createClient(CFG.supabaseUrl, CFG.supabaseKey, {

    storage: window.localStorage, storageKey: 'sb-auth',
    autoRefreshToken: true, persistSession: true, detectSessionInUrl: true,

/* ═══════════════════════════════════════
   CATEGORIAS (novo conjunto)
═══════════════════════════════════════ */
const CATEGORIAS = [
  { key: 'destaques', label: 'Destaques', icon: '⭐', tipos: null, special: 'featured' },
  { key: 'cash',      label: 'Cash',       icon: '💰', tipos: ['cash'] },
  { key: 'pacote',    label: 'Pacotes',    icon: '📦', tipos: ['pacote', 'especial'] },
  { key: 'arma',      label: 'Armas',      icon: '🔫', tipos: ['arma'] },
  { key: 'avatar',    label: 'Avatares',   icon: '👤', tipos: ['avatar'] },
  { key: 'roupa',     label: 'Roupas',     icon: '👕', tipos: ['roupa'] },
  { key: 'danca',     label: 'Danças',     icon: '💃', tipos: ['danca'] },
  { key: 'acessorio', label: 'Acessórios', icon: '💎', tipos: ['acessorio'] },
  { key: 'pet',       label: 'Pets',       icon: '🐾', tipos: ['pet'] },
  { key: 'servico',   label: 'Serviços',   icon: '🛠️', tipos: ['servico'] },
];

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let state = {
  user: null, cart: [], products: [], itemMap: {},
  activeCat: 'destaques', heroIndex: 0, heroInterval: null,
};

/* ═══════════════════════════════════════
   VIEWS
═══════════════════════════════════════ */
function showView(id) {
  document.querySelectorAll('.view[id^="v-"]').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

/* ═══════════════════════════════════════
   AUTH
═══════════════════════════════════════ */
async function login() {
  await sb.auth.signInWithOAuth({
    provider: 'discord',
    options: { scopes: 'identify email guilds', redirectTo: CFG.siteUrl }
  });
}

async function logout() {
  appInitialized = false; state.user = null; state.cart = [];
  document.cookie = 'sb-user=; path=/; max-age=0';
  try { await sb.auth.signOut(); } catch(e) {}
  localStorage.clear(); sessionStorage.clear();
  showView('v-login');
}

/* ═══════════════════════════════════════
   GUILD CHECK
═══════════════════════════════════════ */
async function checkGuildMember(userId) {
  if (!CFG.discordServerId || CFG.discordServerId.startsWith('COLE')) return true;
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch(`${CFG.supabaseUrl}/functions/v1/check-member`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CFG.supabaseKey },
      body: JSON.stringify({ discord_id: userId }), signal: ctrl.signal
    });
    if (!r.ok) return true;
    const data = await r.json();
    return data?.isMember !== false;
  } catch { return true; }
}

/* ═══════════════════════════════════════
   APP INIT
═══════════════════════════════════════ */
async function initApp(user, session) {
  showView('v-loading');
  await new Promise(r => setTimeout(r, 1500));
  const meta = user.user_metadata;
  const discordId = meta.provider_id || meta.sub || user.id;
  const username  = meta.full_name || meta.custom_claims?.global_name || meta.name || 'Usuário';
  const avatar    = meta.avatar_url || `https://cdn.discordapp.com/embed/avatars/0.png`;

  const isMember = await checkGuildMember(discordId);
  if (!isMember) { showView('v-no-member'); return; }

  state.user = { id: discordId, username, avatar };
  document.cookie = 'sb-user=' + encodeURIComponent(JSON.stringify({id:discordId,username,avatar})) + '; path=/; max-age=604800; SameSite=Lax';

  document.getElementById('user-avatar').src = avatar;
  document.getElementById('user-name').textContent = username;
  document.querySelectorAll('.link-discord').forEach(a => a.href = CFG.discordInvite);

  showView('v-app');
  await loadStringsXml();
  await loadProducts();

  const _r = await fetch(`${CFG.supabaseUrl}/rest/v1/perfis?discord_id=eq.${discordId}&select=nome_personagem`, {
    headers: { 'apikey': CFG.supabaseKey, 'Authorization': 'Bearer ' + CFG.supabaseKey }
  });
  const _d = await _r.json();
  const perfil = Array.isArray(_d) ? _d[0] : null;
  if (!perfil?.nome_personagem) {
    document.getElementById('modal-personagem').classList.add('open');
  } else {
    state.user.nomePersonagem = perfil.nome_personagem;
  }
}

/* ═══════════════════════════════════════
   STRINGS.XML
═══════════════════════════════════════ */
async function loadStringsXml() {
  try {
    const r = await fetch('/strings.xml');
    if (!r.ok) return;
    const buf = await r.arrayBuffer();
    const txt = new TextDecoder('windows-1252').decode(buf);
    const doc = new DOMParser().parseFromString(txt, 'text/xml');
    const map = {};
    doc.querySelectorAll('STR[id]').forEach(el => {
      const id = el.getAttribute('id') || '';
      const m = id.match(/^ZITEM_NAME_(\d+)$/);
      if (m) map[m[1]] = el.textContent.trim();
    });
    state.itemMap = map;
  } catch(e) {}
}

/* ═══════════════════════════════════════
   PRODUCTS
═══════════════════════════════════════ */
async function loadProducts() {
  try {
    const r = await fetch(
      `${CFG.supabaseUrl}/rest/v1/produtos?ativo=eq.true&order=ordem.asc,criado_em.desc`,
      { headers: { 'apikey': CFG.supabaseKey, 'Authorization': 'Bearer ' + CFG.supabaseKey } }
    );
    state.products = await r.json();
    if (!Array.isArray(state.products)) { state.products = []; return; }
  } catch(e) { state.products = []; return; }
  renderSidebar();
  renderHero();
  setActiveCat('destaques');
}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  const agora = new Date();
  const active = state.products.filter(p => !p.expiracao || new Date(p.expiracao) > agora);

  nav.innerHTML = '';
  CATEGORIAS.forEach(cat => {
    let count = 0;
    if (cat.special === 'featured') count = active.filter(p => p.destaque).length;
    else if (cat.tipos) count = active.filter(p => cat.tipos.includes(p.tipo_pacote || 'pacote')).length;

    const btn = document.createElement('button');
    btn.className = 'nav-cat' + (cat.key === state.activeCat ? ' active' : '');
    btn.dataset.cat = cat.key;
    btn.innerHTML = `<span class="cat-icon">${cat.icon}</span>${cat.label}${count > 0 ? ` <small style="color:var(--muted);font-size:.7rem;margin-left:auto">${count}</small>` : ''}`;
    btn.onclick = () => setActiveCat(cat.key);
    nav.appendChild(btn);
  });
}

/* ═══════════════════════════════════════
   HERO BANNER
═══════════════════════════════════════ */
function renderHero() {
  const agora = new Date();
  // Pick up to 5 featured/promo products for banner
  const featured = state.products.filter(p =>
    p.destaque && p.ativo && (!p.expiracao || new Date(p.expiracao) > agora)
  ).slice(0, 5);

  if (!featured.length) {
    document.getElementById('hero-section').style.display = 'none';
    return;
  }
  document.getElementById('hero-section').style.display = 'block';

  const slidesEl = document.getElementById('hero-slides');
  slidesEl.innerHTML = featured.map((p, i) => {
    const discount = p.preco_original ? Math.round((1 - p.preco / p.preco_original) * 100) : null;
    return `<div class="hero-slide" style="${p.imagem_url ? `background-image:url(${p.imagem_url});background-size:cover;background-position:center` : ''}">
      ${p.imagem_url ? '<div class="hero-slide-overlay"></div>' : ''}
      <div class="hero-content">
        <div class="hero-badge">${p.tipo_pacote === 'especial' ? 'ESPECIAL' : 'DESTAQUE'}</div>
        <div class="hero-title">${esc(p.nome)}</div>
        ${p.descricao ? `<div class="hero-sub">${esc(p.descricao.substring(0,80))}${p.descricao.length>80?'…':''}</div>` : ''}
        <div class="hero-promo">
          ${discount ? `<span class="discount">${discount}% OFF</span>` : ''}
          ${p.preco_original ? `<span class="label">De <s style="color:var(--muted)">${formatBRL(p.preco_original)}</s> por</span>` : ''}
        </div>
        <button class="btn-hero" onclick="addToCart('${p.id}')">
          Comprar por ${formatBRL(p.preco)} →
        </button>
      </div>
    </div>`;
  }).join('');

  const dotsEl = document.getElementById('hero-dots');
  dotsEl.innerHTML = featured.map((_, i) =>
    `<div class="hero-dot ${i===0?'active':''}" onclick="heroGoto(${i})"></div>`
  ).join('');

  // auto-slide
  if (state.heroInterval) clearInterval(state.heroInterval);
  if (featured.length > 1) {
    state.heroInterval = setInterval(() => heroNext(), 5000);
  }
}

function heroGoto(idx) {
  const slides = document.getElementById('hero-slides');
  const dots = document.querySelectorAll('.hero-dot');
  const count = slides.children.length;
  state.heroIndex = (idx + count) % count;
  slides.style.transform = `translateX(-${state.heroIndex * 100}%)`;
  dots.forEach((d, i) => d.classList.toggle('active', i === state.heroIndex));
}
function heroPrev() { heroGoto(state.heroIndex - 1); }
function heroNext() { heroGoto(state.heroIndex + 1); }

/* ═══════════════════════════════════════
   RENDER CATEGORY
═══════════════════════════════════════ */
function setActiveCat(key) {
  state.activeCat = key;
  // Update sidebar
  document.querySelectorAll('.nav-cat').forEach(b => b.classList.toggle('active', b.dataset.cat === key));
  renderActiveSection();
}

function getProductsForCat(key) {
  const agora = new Date();
  const active = state.products.filter(p => p.ativo && (!p.expiracao || new Date(p.expiracao) > agora));
  const cat = CATEGORIAS.find(c => c.key === key);
  if (!cat) return [];
  if (cat.special === 'featured') return active.filter(p => p.destaque);
  if (!cat.tipos) return active;
  return active.filter(p => cat.tipos.includes(p.tipo_pacote || 'pacote'));
}

function renderActiveSection() {
  const content = document.getElementById('store-sections');
  const cat = CATEGORIAS.find(c => c.key === state.activeCat);
  const prods = getProductsForCat(state.activeCat);

  if (!prods.length) {
    content.innerHTML = `<div class="empty-section">Nenhum produto disponível nesta categoria.</div>`;
    return;
  }

  const cards = prods.map((p, i) => renderCard(p, i)).join('');
  content.innerHTML = `
    <div class="cat-section">
      <div class="cat-header">
        <div class="cat-header-left">
          <span class="cat-icon-big">${cat?.icon||'📦'}</span>
          <span class="cat-name">${cat?.label||''}</span>
          <span class="cat-count">${prods.length} iten${prods.length!==1?'s':'o'}</span>
        </div>
      </div>
      <div class="products-row">${cards}</div>
    </div>`;
}

function renderCard(p, i) {
  const agora = new Date();
  const expiracao = p.expiracao ? new Date(p.expiracao) : null;
  const expiryStr = expiracao ? expiracao.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : null;

  const qtyLines = [];
  if (p.qtd_cash  && +p.qtd_cash  > 0) qtyLines.push(`💰 ${(+p.qtd_cash).toLocaleString('pt-BR')} Cash`);
  if (p.qtd_prata && +p.qtd_prata > 0) qtyLines.push(`🥈 ${(+p.qtd_prata).toLocaleString('pt-BR')} Prata`);
  if (p.qtd_ouro  && +p.qtd_ouro  > 0) qtyLines.push(`🥇 ${(+p.qtd_ouro).toLocaleString('pt-BR')} Ouro`);
  const itemCount = p.item_ids ? p.item_ids.split(',').filter(x=>x.trim()).length : 0;
  if (itemCount > 0) qtyLines.push(`🎁 ${itemCount} item${itemCount!==1?'s':''}`);

  // hover overlay
  let overlayItems = '';
  qtyLines.forEach(q => { overlayItems += `<div class="ov-item">${q}</div>`; });
  if (p.item_ids) {
    p.item_ids.split(',').map(x=>x.trim()).filter(Boolean).forEach(id => {
      overlayItems += `<div class="ov-item">• ${esc(state.itemMap[id] || `Item #${id}`)}</div>`;
    });
  }
  const hasOverlay = overlayItems || p.descricao;
  const overlay = hasOverlay ? `<div class="card-hover-overlay">
    <div class="ov-title">Inclusos</div>
    <div class="ov-items">${overlayItems}</div>
    ${p.descricao ? `<div class="ov-desc">${esc(p.descricao)}</div>` : ''}
  </div>` : '';

  const discount = p.preco_original ? Math.round((1 - p.preco / p.preco_original) * 100) : null;

  return `<div class="product-card ${p.destaque?'featured':''}" style="animation-delay:${i*.05}s">
    ${overlay}
    <div class="card-img-wrap">
      ${p.imagem_url
        ? `<img src="${p.imagem_url}" alt="${esc(p.nome)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder>📦</div>'">`
        : '<div class="card-img-placeholder">📦</div>'}
      <div class="card-badges">
        ${p.destaque ? '<span class="badge badge-featured">⭐ Destaque</span>' : ''}
        ${discount ? `<span class="badge badge-sale">-${discount}%</span>` : ''}
      </div>
    </div>
    <div class="card-body">
      <div class="card-name">${esc(p.nome)}</div>
      <div class="card-meta">
        ${qtyLines.map(q=>`<div class="card-qty">${q}</div>`).join('')}
        ${expiryStr ? `<div class="card-expiry">⏰ até ${expiryStr}</div>` : ''}
      </div>
    </div>
    <div class="card-footer">
      <div class="card-price-wrap">
        ${p.preco_original ? `<div class="card-price-old">${formatBRL(p.preco_original)}</div>` : ''}
        <div class="card-price">${formatBRL(p.preco)}</div>
      </div>
      <button class="btn-add" id="add-btn-${p.id}" onclick="addToCart('${p.id}')" title="Adicionar">+</button>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════
   CART
═══════════════════════════════════════ */
function addToCart(prodId) {
  const produto = state.products.find(p => p.id === prodId);
  if (!produto) return;
  const existing = state.cart.find(i => i.produto.id === prodId);
  if (existing) existing.qty++;
  else state.cart.push({ produto, qty: 1 });
  updateCartUI();
  const btn = document.getElementById(`add-btn-${prodId}`);
  if (btn) {
    btn.textContent = '✓'; btn.classList.add('added');
    setTimeout(() => { btn.textContent = '+'; btn.classList.remove('added'); }, 1500);
  }
  toast(`"${produto.nome}" adicionado ✓`, 'success');
}

function updateQty(prodId, delta) {
  const item = state.cart.find(i => i.produto.id === prodId);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) state.cart = state.cart.filter(i => i.produto.id !== prodId);
  updateCartUI();
}

function removeFromCart(prodId) {
  state.cart = state.cart.filter(i => i.produto.id !== prodId);
  updateCartUI();
}

function updateCartUI() {
  const total = state.cart.reduce((s, i) => s + i.produto.preco * i.qty, 0);
  const count = state.cart.reduce((s, i) => s + i.qty, 0);

  // Header badge
  const badge = document.getElementById('cart-badge');
  badge.textContent = count;
  badge.classList.toggle('hidden', count === 0);

  // Header price
  document.getElementById('cart-header-price').textContent = count > 0 ? formatBRL(total) : '';

  // Drawer total
  document.getElementById('cart-total').textContent = formatBRL(total);

  // Checkout buttons
  document.querySelectorAll('.btn-checkout, .btn-checkout-mini').forEach(b => b.disabled = !state.cart.length);

  // Sidebar mini cart
  const miniItems = document.getElementById('cart-mini-items');
  const miniTotal = document.getElementById('cart-mini-total-val');
  if (!state.cart.length) {
    miniItems.innerHTML = '<div class="cart-mini-empty">Carrinho vazio</div>';
    miniTotal.textContent = 'R$ 0,00';
  } else {
    miniItems.innerHTML = state.cart.map(({produto:p, qty}) =>
      `<div class="cart-mini-item"><span>${esc(p.nome)} x${qty}</span><span class="price">${formatBRL(p.preco*qty)}</span></div>`
    ).join('');
    miniTotal.textContent = formatBRL(total);
  }

  // Drawer items
  const list = document.getElementById('cart-items-list');
  if (!state.cart.length) {
    list.innerHTML = '<div class="cart-empty-msg"><span>🛒</span><span>Carrinho vazio</span></div>';
    return;
  }
  list.innerHTML = state.cart.map(({produto:p, qty}) => `
    <div class="cart-item">
      <div class="cart-item-img">
        ${p.imagem_url
          ? `<img src="${p.imagem_url}" alt="" onerror="this.parentElement.textContent='📦'">`
          : '📦'}
      </div>
      <div class="cart-item-info">
        <div class="cart-item-name">${esc(p.nome)}</div>
        <div class="cart-item-price">${formatBRL(p.preco * qty)}</div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="updateQty('${p.id}',-1)">−</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" onclick="updateQty('${p.id}',1)">+</button>
        </div>
      </div>
      <button class="cart-remove" onclick="removeFromCart('${p.id}')">🗑</button>
    </div>`).join('');
}

function toggleCart() {
  const drawer  = document.getElementById('cart-drawer');
  const overlay = document.getElementById('drawer-overlay');
  const isOpen  = drawer.classList.contains('open');
  drawer.classList.toggle('open', !isOpen);
  overlay.classList.toggle('open', !isOpen);
  document.body.style.overflow = isOpen ? '' : 'hidden';
}

/* ═══════════════════════════════════════
   PERSONAGEM
═══════════════════════════════════════ */
async function salvarPersonagem() {
  const nome = document.getElementById('input-personagem').value.trim();
  if (!nome) { toast('Digite o nome do personagem.', 'error'); return; }
  const btn = document.getElementById('btn-salvar-personagem');
  btn.textContent = 'Salvando...'; btn.disabled = true;
  try {
    await fetch(`${CFG.supabaseUrl}/rest/v1/perfis`, {
      method: 'POST',
      headers: {
        'apikey': CFG.supabaseKey, 'Authorization': 'Bearer ' + CFG.supabaseKey,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates',
      },
      body: JSON.stringify({ discord_id: state.user.id, nome_personagem: nome, atualizado_em: new Date().toISOString() })
    });
    state.user.nomePersonagem = nome;
    document.getElementById('modal-personagem').classList.remove('open');
    toast(`Bem-vindo, ${nome}! ✅`, 'success');
  } catch(e) {
    toast('Erro ao salvar. Tente novamente.', 'error');
    btn.textContent = 'Confirmar →'; btn.disabled = false;
  }
}

/* ═══════════════════════════════════════
   SEARCH
═══════════════════════════════════════ */
function handleSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { renderActiveSection(); return; }
  const agora = new Date();
  const results = state.products.filter(p =>
    p.ativo && (!p.expiracao || new Date(p.expiracao) > agora) &&
    (p.nome||'').toLowerCase().includes(q)
  );
  const content = document.getElementById('store-sections');
  if (!results.length) {
    content.innerHTML = `<div class="empty-section">Nenhum produto encontrado para "${esc(q)}".</div>`;
    return;
  }
  const cards = results.map((p,i) => renderCard(p,i)).join('');
  content.innerHTML = `<div class="cat-section">
    <div class="cat-header"><div class="cat-header-left">
      <span class="cat-icon-big">🔍</span>
      <span class="cat-name">Resultados: "${esc(q)}"</span>
      <span class="cat-count">${results.length}</span>
    </div></div>
    <div class="products-row">${cards}</div>
  </div>`;
}

/* ═══════════════════════════════════════
   CHECKOUT
═══════════════════════════════════════ */
async function checkout() {
  if (!state.cart.length) return;
  const btn = document.getElementById('btn-checkout');
  btn.disabled = true; btn.textContent = 'Processando...';
  try {
    const itens = state.cart.map(({ produto, qty }) => ({
      id: produto.id, nome: produto.nome, preco: produto.preco, quantidade: qty,
      conteudo: produto.conteudo||'', item_ids: produto.item_ids||'',
      item_cash_values: produto.item_cash_values||'', qtd_cash: produto.qtd_cash||0,
      qtd_prata: produto.qtd_prata||0, qtd_ouro: produto.qtd_ouro||0,
      tipo_pacote: produto.tipo_pacote||'pacote',
    }));
    const total = itens.reduce((s,i) => s + i.preco * i.quantidade, 0);
    const res = await fetch(`${CFG.supabaseUrl}/functions/v1/create-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CFG.supabaseKey },
      body: JSON.stringify({ itens, total, discord_id: state.user.id,
        discord_username: state.user.username, discord_avatar: state.user.avatar,
        nome_personagem: state.user.nomePersonagem ?? '' })
    });
    const data = await res.json();
    if (!data?.payment_url) throw new Error(data?.error || 'Falha');
    state.cart = []; updateCartUI(); toggleCart();
    window.location.href = data.payment_url;
  } catch(err) {
    toast('Erro ao finalizar compra. Tente novamente.', 'error');
    btn.disabled = false; btn.textContent = 'Finalizar Compra →';
  }
}

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function formatBRL(val) {
  return (val ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type='info', duration=4000) {
  const icon = type==='success'?'✅':type==='error'?'❌':'ℹ️';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

/* ═══════════════════════════════════════
   BOOTSTRAP
═══════════════════════════════════════ */
document.querySelectorAll('.link-discord').forEach(a => a.href = CFG.discordInvite);
document.getElementById('btn-login').addEventListener('click', login);
document.getElementById('btn-logout-nomember').addEventListener('click', logout);
document.getElementById('search-input').addEventListener('input', e => handleSearch(e.target.value));

let appInitialized = false;

// F5 cookie restore
(async () => {
  try {
    const match = document.cookie.match(/(^| )sb-user=([^;]+)/);
    if (match) {
      const userData = JSON.parse(decodeURIComponent(match[2]));
      const isMember = await checkGuildMember(userData.id);
      if (!isMember) { showView('v-no-member'); return; }
      state.user = userData;
      document.getElementById('user-avatar').src = userData.avatar;
      document.getElementById('user-name').textContent = userData.username;
      appInitialized = true;
      showView('v-app');
      await loadStringsXml();
      await loadProducts();
      const pr = await fetch(`${CFG.supabaseUrl}/rest/v1/perfis?discord_id=eq.${userData.id}&select=nome_personagem`, {
        headers: { 'apikey': CFG.supabaseKey, 'Authorization': 'Bearer ' + CFG.supabaseKey }
      });
      const pd = await pr.json();
      const prow = Array.isArray(pd) ? pd[0] : null;
      if (!prow?.nome_personagem) {
        document.getElementById('modal-personagem').classList.add('open');
      } else {
        state.user.nomePersonagem = prow.nome_personagem;
      }
      return;
    }
  } catch(e) {}
  showView('v-login');
})();

sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session && !appInitialized) {
    appInitialized = true;
    await initApp(session.user, session);
  } else if (event === 'SIGNED_OUT') {
    appInitialized = false; state.user = null; state.cart = [];
    document.cookie = 'sb-user=; path=/; max-age=0';
    showView('v-login');
  }
});

</script>
